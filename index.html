<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuracion Basica -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Conexion a CSS-->
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <!-- Barra de navegacion -->
        <nav class="navbar">
            <!-- Logo -->
            <div class="navbar_Logo">
                <img src="static/images/Logo.png" alt="Logo">
                <h1>Video<span class="rojo">Stream</span></h1>
            </div>
            <!-- Links de navbar -->
            <div class="navbar_Links">
                <a href="#">Inicio</a>
                <a href="#">Explorar</a>
                <a href="#">Mi Lista</a>
            </div>
            <!-- Extras de la navbar -->
            <div class="navbar_Extras">
                <input type="text">
                <img>
                <img>
            </div>
        </nav>
    </header>
    <!-- Main -->
    <main class="main">
        <!-- Div del video principal -->
        <div class="video_Principal">
            <!-- Video -->
            <div class="video">
                <video controls>
                    <source src="static/videos/Lagos.mp4" type="video/mp4">
                    Tu navegador no soporta la reproducción de video.
                </video>
            </div>
            <div class="info_Video">

            </div>
        </div>
        <!-- Div de la cola de los videos -->
        <div class="cola_Videos">

        </div>

        <!-- Videos recomendados-->
        <div class="videos_Recomendados">

        </div>
    </main>
</body>

</html>
